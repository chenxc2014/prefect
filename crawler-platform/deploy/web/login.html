<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一登录 · 采集管理平台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;font:14px/1.8 system-ui,"Microsoft YaHei";color:#23314c;min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(960px,100%);display:grid;grid-template-columns:1.1fr 1fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 80px #1d2b4818}.intro{background:linear-gradient(140deg,#152442,#34417e);color:white;padding:58px 44px;position:relative;overflow:hidden}.intro:after{content:"";position:absolute;width:250px;height:250px;border:35px solid #ffffff08;border-radius:50%;right:-120px;bottom:-100px}.mark{width:46px;height:46px;background:#647cff;border-radius:12px;display:grid;place-items:center;font-size:25px;margin-bottom:32px}.eyebrow{font-size:10px;letter-spacing:2px;color:#9caff0}h1{font-size:28px;line-height:1.6;margin:8px 0 12px;letter-spacing:1px}.intro p{font-size:13px;color:#b9c7e6;margin:0 0 30px}.engines{display:flex;gap:8px;flex-wrap:wrap}.engines span{border:1px solid #ffffff25;background:#ffffff09;padding:4px 10px;border-radius:6px;font-size:11px}.form{padding:58px 44px}h2{font-size:23px;margin:0 0 4px}.sub{font-size:12px;color:#7b889e;margin:0 0 28px}label{display:block;margin-top:16px;font-size:12px;color:#607087}input{display:block;width:100%;font:inherit;padding:10px 13px;border:1px solid #dbe1ec;border-radius:8px;margin-top:6px;background:#fcfdff;color:#23314c}input:focus{outline:3px solid #e3e8ff;border-color:#7388ed}button{width:100%;margin-top:25px;border:0;border-radius:8px;background:#405bf0;color:white;font:600 14px/1.6 inherit;padding:12px;cursor:pointer}button:hover{background:#344de0}button:disabled{opacity:.55;cursor:wait}.note{font-size:11px;color:#8b97aa;margin-top:20px}.error{color:#b34050;font-size:12px;min-height:23px;margin-top:10px}.footer{text-align:center;color:#9ba6b8;font-size:11px;margin-top:18px}@media(max-width:700px){.login{grid-template-columns:1fr;max-width:450px}.intro{padding:30px}.mark{margin-bottom:12px}h1{font-size:23px}.intro p{margin-bottom:18px}.form{padding:30px}}</style></head><body><div><main class="login"><section class="intro"><div class="mark">◇</div><div class="eyebrow">COLLECTION HUB</div><h1>一次登录，贯通采集流程</h1><p>从网站设计到任务调度与结果归档，<br>在统一工作台开始你的采集工作。</p><div class="engines"><span>多引擎工作台</span><span>Prefect 调度</span><span>Maxun 在线设计</span></div></section><section class="form"><h2>登录采集管理平台</h2><p class="sub">登录后进入 Prefect、Maxun，无需再次输入账号密码。</p><form id="login-form" method="post" action="/collector/login"><input type="hidden" name="csrf" value="__LOGIN_NONCE__"><input type="hidden" name="next" value="__NEXT_APP__"><label>用户名<input name="username" autocomplete="username" placeholder="请输入平台用户名" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入平台密码" required></label><button id="submit" type="submit">登录统一工作台</button><p class="error" id="error" role="alert"></p></form><p class="note">使用现有平台账号 crawlerdev 登录。网站业务账号仍由各采集任务独立管理。</p></section></main><div class="footer">采集管理平台 · 统一登录</div></div><script>
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('error');button.disabled=true;message.textContent='';try{const response=await fetch('/collector/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'},body:new URLSearchParams(new FormData(event.target))});const result=await response.json();if(!response.ok)throw Error(result.detail||'登录失败，请重试');location.replace(result.next);}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
